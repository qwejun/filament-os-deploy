version: '3.8'

services:
  filament-os:
    image: qwejun/filament-os:latest
    container_name: filament-os
    restart: unless-stopped
    ports:
      - "${PORT:-2233}:2233"
    volumes:
      # 主应用数据
      - ./data:/app/data
      - ./backups:/app/backups
      - ./uploads:/app/uploads
      # 打印机服务配置（登录状态持久化）
      - ./bambu-config:/app/bambu-config
      # 视频流缓存
      - ./bambu-streams:/app/bambu-streams
      # 延时摄影存储
      - ./timelapse:/app/timelapse
      # 日志存储
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/database.sqlite
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=2233
      - INIT_ADMIN_USERNAME=${ADMIN_USER:-admin}
      - INIT_ADMIN_PASSWORD=${ADMIN_PASS:-ChangeMe123}
      - UPLOAD_DIR=/app/uploads
      # 打印机服务配置
      - CONNECTION_MODE=cloud
      - FLASK_PORT=5000
      - FLASK_DEBUG=False
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2233"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
