version: '3.8'

services:
  filament-os-go:
    image: qwejun/filament-os-go:latest
    container_name: filament-os-go
    restart: unless-stopped
    ports:
      - "${PORT:-2233}:5000"
    volumes:
      # 主应用数据（SQLite数据库、会话等）
      - ./data:/app/data
      # 打印机录像存储
      - ./recordings:/app/recordings
      # 视频流缓存
      - ./bambu-streams:/app/bambu-streams
      # FTP 备份
      - ./backups:/app/backups
      # 日志存储
      - ./logs:/app/logs
    environment:
      # 管理员账号配置（必须设置！）
      - INIT_ADMIN_USERNAME=${INIT_ADMIN_USERNAME}
      - INIT_ADMIN_PASSWORD=${INIT_ADMIN_PASSWORD}
      # 路径配置（对齐原有 NAS 挂载）
      - RECORDING_DIR=/app/recordings
      - STREAMS_DIR=/app/bambu-streams
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 512M
